<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>TV Show Finder</title>
  </head>
  <body>
    <header class="cabecera" id="cabecera">
      <h1>TV Show Finder</h1>
      <form id="formulario" class="buscador">
        <input id="busqueda" type="text" placeholder="Search for a show..." />
        <button type="submit">	Search</button>
        <label class="filtro">
          <input type="checkbox" id="soloNota" /> Rated only
        </label>
      </form>
    </header>
    
    <main>
      <div id="lista">
        <p id="media" class="media"></p>
        <div id="resultado" class="resultado"></div>
      </div>
      <section id="detalle" class="detalle" hidden></section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
